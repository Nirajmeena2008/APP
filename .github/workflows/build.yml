name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools-version: 35.0.0

      - name: Download Inter font
        run: |
          mkdir -p app/src/main/res/font
          wget -q "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            -O "app/src/main/res/font/Inter-VariableFont_opsz,wght.ttf"
          ls -la app/src/main/res/font/

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK found: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK not found!"
            find app/build -name "*.apk"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-alarm-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools-version: 35.0.0

      - name: Download Inter font
        run: |
          mkdir -p app/src/main/res/font
          wget -q "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" \
            -O "app/src/main/res/font/Inter-VariableFont_opsz,wght.ttf"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_signingConfig: release

      - name: Verify Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "✅ Release APK found: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "❌ Release APK not found!"
            find app/build -name "*.apk"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-alarm-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, build-release]
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: liquid-alarm-debug
          path: artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: liquid-alarm-release
          path: artifacts/release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Liquid Alarm v1.0.0 Build #${{ github.run_number }}
          body: |
            ## Liquid Alarm - Personal Android Alarm App
            
            ### Changes
            - Built from commit ${{ github.sha }}
            
            ### APKs
            - **Debug APK**: For testing (unrestricted permissions)
            - **Release APK**: For daily use (signed, optimized)
            
            ### Installation
            1. Download APK
            2. Transfer to phone
            3. Install via File Manager
            4. Grant permissions: Exact Alarm, Notifications, Media, Display over apps, Camera
            5. **Critical**: Settings → Apps → Liquid Alarm → Battery → Unrestricted
            
            ### Features
            - Liquid Glass UI (OLED black, amber accents)
            - Dual alarm sounds (pre-alarm + main)
            - Volume fade (0→100% main, 0→50% pre-alarm)
            - Wake challenges (Math, QR, Shake)
            - Lock screen takeover
            - Timer, Stopwatch, World Clock
            - Home screen widget + Quick Settings tile
          draft: false
          prerelease: false
          files: |
            artifacts/debug/*.apk
            artifacts/release/*.apk
